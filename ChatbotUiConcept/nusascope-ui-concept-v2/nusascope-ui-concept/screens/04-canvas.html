<html lang="id">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NusaScope · Mode Canvas</title>
<!--
  NusaScope UI concept — NusaScope · Mode Canvas
  Layar 4 dari 4. Layar kerja utama: tab sesi, chat, canvas.
  Standalone: cukup buka file ini di browser (font dimuat dari Google Fonts).
  Struktur file:
    1. <style>      → style halaman (sama persis dengan konsep)
    2. view(v)      → markup (inline style dibiarkan apa adanya)
    3. Component    → state & handler (pola React class component)
    4. runtime      → render + event delegation (bukan bagian desain)
-->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet">
<style>
html, body { margin: 0; min-height: 100%; }
#app > div { min-height: 100vh; }
[aria-disabled="true"] { opacity: .5; pointer-events: none; }
body{margin:0}
a{color:#0F5F57}a:hover{color:#0A443E}
.ghost:hover{background:#EDEBE6}
.tab:hover{color:#1A1A1D}
.act:hover{background:#2C2C31}
.ccard:hover{border-color:#0F5F57}
@keyframes wIn{from{opacity:0;filter:blur(4px);transform:translateY(3px)}to{opacity:1;filter:blur(0);transform:none}}
.w{display:inline;animation:wIn .38s ease-out both}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{display:inline-block;width:2px;height:1.1em;background:#0F5F57;vertical-align:-0.18em;margin-left:1px;animation:caret .9s steps(1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;transform-origin:center}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise .3s ease-out both}
@keyframes glow{0%,100%{background:#DDEEEA}50%{background:#CDE6E0}}
.writing{animation:glow 1.4s ease-in-out infinite;border-radius:4px}
.stab{background:transparent;transition:background .12s}
.stab:hover{background:#E1DED7}
.stab.on{background:#F7F6F3}
.tabx{background:transparent}
.tabx:hover{background:#D6D3CB}
.danger:hover{background:#912018 !important}
.newbtn:hover{background:#2C2C31 !important}
@media (max-width:560px){.newbtn{width:32px;padding:0 !important;justify-content:center;font-size:0 !important;gap:0 !important}}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stab{animation:tabIn .2s ease-out both}
@keyframes shim{0%{background-position:-160px 0}100%{background-position:160px 0}}
.shim{background:#EDEBE6 linear-gradient(90deg,#EDEBE6 0,#F7F6F3 50%,#EDEBE6 100%) no-repeat;background-size:160px 100%;animation:shim 1.1s linear infinite}
@media (max-width:860px){.chat{flex-basis:100% !important;max-width:none !important;border-right:none !important;border-bottom:1px solid #E4E2DC}.paper{padding:28px 20px !important}.doc-title{font-size:28px !important}}

</style>
</head>

<script>
/* =================================================================
   2. VIEW — markup layar. `v` = hasil renderVals().
   ================================================================= */
function view(v) {
  return `<div style="width: 100%; min-height: 860px; box-sizing: border-box; background: #F7F6F3; font-family: 'Geist', sans-serif; color: #1A1A1D; display: flex; flex-direction: column; position: relative">

<div style="display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px 0 10px; background: #E9E7E1">
<div style="height: 38px; display: flex; align-items: center; padding: 0 6px 0 2px; flex: none">
<svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#1A1A1D"></rect><circle cx="11" cy="14" r="5" fill="none" stroke="#F7F6F3" stroke-width="2"></circle><circle cx="17" cy="14" r="5" fill="#E9A77E"></circle></svg>
</div>
<div role="tablist" aria-label="Sesi chat" style="display: flex; align-items: flex-end; gap: 2px; flex: 1; min-width: 0; overflow-x: auto">
${(v.sessions || []).map((s, $index) => `
<div class="${esc(s.cls)}" style="flex: 0 1 220px; min-width: 128px; height: 38px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 4px; border-radius: 10px 10px 0 0">
<button role="tab" aria-selected="${esc(s.on)}" data-on-click="${on(s.select)}" style="flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 6px; border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: ${esc(s.weight)}; color: ${esc(s.color)}; cursor: pointer; text-align: left">
<span style="width: 12px; height: 12px; border-radius: 4px; background: ${esc(s.dot)}; flex: none"></span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">${esc(s.title)}</span>
</button>
<button class="tabx" aria-label="${esc(s.closeLabel)}" data-on-click="${on(s.ask)}" style="width: 24px; height: 24px; border-radius: 6px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#55545A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
`).join('')}
<button class="tabx" aria-label="Sesi baru" title="Sesi baru" data-on-click="${on(v.newSession)}" style="width: 32px; height: 32px; margin: 0 0 3px 4px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A1D" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<button class="newbtn" data-on-click="${on(v.newSession)}" style="height: 32px; margin-bottom: 4px; padding: 0 12px 0 10px; border-radius: 9px; border: none; background: #1A1A1D; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Sesi baru</button>
</div>
<header style="display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid #E4E2DC; background: #F7F6F3">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#1A1A1D"></rect><circle cx="11" cy="14" r="5" fill="none" stroke="#F7F6F3" stroke-width="2"></circle><circle cx="17" cy="14" r="5" fill="#E9A77E"></circle></svg>
<span style="font-size: 15px; font-weight: 600">NusaScope</span>
<span style="color: #C9C6BE">/</span>
<span style="font-size: 14px; color: #55545A; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">${esc(v.activeTitle)}</span>
<button class="ghost" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #E4E2DC; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #1A1A1D; cursor: pointer">Bagikan</button>
</header>

<div style="flex: 1; display: flex; flex-wrap: wrap; min-height: 0">

<section class="chat" aria-label="Percakapan" data-on-dragover="${on(v.onDragOver)}" data-on-drop="${on(v.onDrop)}" style="flex: 1 1 380px; max-width: 420px; box-sizing: border-box; border-right: 1px solid #E4E2DC; display: flex; flex-direction: column; padding: 20px 18px; gap: 18px; position: relative">
${v.dragging ? `
<div data-on-dragleave="${on(v.onDragLeave)}" style="position: absolute; inset: 10px; border: 2px dashed #0F5F57; border-radius: 16px; background: rgba(234,243,241,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 6">
<svg class="pop" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0F5F57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"></path></svg>
<span style="font-size: 15px; font-weight: 600; color: #0F5F57">Lepas gambar di sini</span>
<span style="font-size: 12px; color: #3F4A48">PNG, JPG, WEBP</span>
</div>
` : ''}

<div style="align-self: flex-end; max-width: 88%; background: #EDEBE6; padding: 11px 14px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.55">Buatkan proposal singkat untuk kedai "Kopi Deadline", buat diajukan ke investor kecil.</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#3D3F8F" stroke-width="1.8"></circle><circle cx="16" cy="16" r="8.5" fill="none" stroke="#3D3F8F" stroke-width="1.8"></circle><circle cx="16" cy="16" r="4" fill="#3D3F8F"></circle></svg>
<span style="font-size: 13px; font-weight: 600">GLM</span>
</div>

/* =================================================================
   3. COMPONENT — state & logika (sama dengan konsep).
   ================================================================= */

/* ------------------------------------------------------------------
   Mini runtime (± 60 baris) — meniru React class component:
   state, setState, renderVals() → view(), componentDidMount/WillUnmount.
   view(v) mengembalikan string HTML; DOM di-patch dengan Idiomorph
   supaya elemen yang tidak berubah tidak di-render ulang (animasi aman).
   Di React: renderVals() = isi function component, view() = JSX.
------------------------------------------------------------------- */
const esc = (x) => (x === null || x === undefined) ? '' : String(x)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let HANDLERS = [];
const on = (fn) => { HANDLERS.push(fn); return HANDLERS.length - 1; };

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    const p = typeof patch === 'function' ? patch(this.state) : patch;
    this.state = Object.assign({}, this.state, p);
    scheduleRender();
  }
  forceUpdate() { scheduleRender(); }
}


class Component extends DCLogic {
  constructor(p) {
    super(p);
    const P0 = 'Logo minimalis cangkir kopi dengan jam pasir di tengahnya, gaya flat, warna hangat.';
    this.state = { tab: 'doc', tick: 0, imgMode: 'view', genP: 0, batch: 1, pal: null, target: null, prompt: P0, draft: P0, style: 'Flat', ratio: '1:1', appliedRatio: '1:1', strength: 'Sedang', note: null };
    this.state.sessions = [
      { id: 1, title: 'Proposal kedai kopi', dot: '#3D3F8F' },
      { id: 2, title: 'Query SQL join 3 tabel', dot: '#0F5F57' },
      { id: 3, title: 'Ringkas laporan Q3', dot: '#B45F2E' }
    ];
    this.state.atts = [];
    this.state.sent = [];
    this.state.msg = '';
    this.state.menuOpen = false;
    this.state.dragging = false;
    this.state.ai = 'idle';
    this.attId = 1;
    this.state.activeS = 1;
    this.state.confirmId = null;
    this.nextId = 4;
    this.SET_A = [
      { bg: '#F3E6D8', cup: '#5B3A29', acc: '#E9A77E', steam: '#B89A86' },
      { bg: '#1F2A2A', cup: '#F3E6D8', acc: '#5FB3A3', steam: '#6E8C88' },
      { bg: '#E7EEF0', cup: '#0F5F57', acc: '#E9A77E', steam: '#9BB5B1' },
      { bg: '#2B2440', cup: '#E9A77E', acc: '#F3E6D8', steam: '#7C7396' }
    ];
    this.SET_B = [
      { bg: '#EAF3F1', cup: '#1A1A1D', acc: '#E9A77E', steam: '#9BB5B1' },
      { bg: '#FBF1EA', cup: '#B45F2E', acc: '#1A1A1D', steam: '#D9B9A2' },
      { bg: '#1A1A1D', cup: '#E9A77E', acc: '#1A1A1D', steam: '#55545A' },
      { bg: '#EEEEF8', cup: '#3D3F8F', acc: '#E9A77E', steam: '#A9AAD6' }
    ];
    this.doc = 'Kopi Deadline: kedai kopi dekat kampus [NAMA KAMPUS] untuk mahasiswa yang butuh tempat fokus sampai larut, dengan harga ramah kantong.'.split(' ');
    this.reply = 'Sudah. Ringkasan sekarang cukup satu kalimat, dan lokasi kampus saya gabungkan ke dalamnya.'.split(' ');
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const total = 6 + this.doc.length + 4 + this.reply.length + 40;
      this.setState({ tick: (this.state.tick + 1) % total });
    }, 90);
  }
  componentWillUnmount() { clearInterval(this.timer); clearInterval(this.gt); clearInterval(this.ut); clearTimeout(this.at); }
  addFiles(files) {
    const list = Array.from(files || []).filter((f) => f && f.type && f.type.indexOf('image/') === 0);
    if (!list.length) return;
    const add = list.map((f) => ({ id: this.attId++, name: f.name, url: URL.createObjectURL(f), real: true, p: 0 }));
    this.setState((s) => ({ atts: [...s.atts, ...add], menuOpen: false, dragging: false }));
    this.runUpload();
  }
  runUpload() {
    clearInterval(this.ut);
    this.ut = setInterval(() => {
      const pending = this.state.atts.some((a) => a.p < 100);
      if (!pending) { clearInterval(this.ut); return; }
      this.setState((s) => ({ atts: s.atts.map((a) => (a.p < 100 ? { ...a, p: Math.min(100, a.p + 7) } : a)) }));
    }, 60);
  }
  attVals() {
    const s = this.state;
    const atts = s.atts.map((a) => ({
      ...a, sample: !a.real, uploading: a.p < 100, pct: a.p + '%',
      filter: a.p < 100 ? 'brightness(.75) blur(1px)' : 'none',
      removeLabel: 'Hapus ' + a.name,
      remove: () => this.setState((st) => ({ atts: st.atts.filter((x) => x.id !== a.id) }))
    }));
    const ready = s.atts.length > 0 && s.atts.every((a) => a.p >= 100);
    const canSend = ready || (s.atts.length === 0 && s.msg.trim().length > 0);
    const sent = s.sent.map((m) => ({ ...m, hasText: !!m.text, atts: m.atts.map((a) => ({ ...a, sample: !a.real })) }));
    return {
      atts, hasAtts: atts.length > 0, sent, msg: s.msg, menuOpen: s.menuOpen, dragging: s.dragging,
      aiThinking: s.ai === 'thinking', aiSeen: s.ai === 'seen',
      placeholder: atts.length ? 'Tanya tentang gambar ini…' : 'Minta perubahan…',
      composerBorder: atts.length ? '1.5px solid #0F5F57' : '1px solid #E4E2DC',
      attachBg: s.menuOpen ? '#EDEBE6' : 'transparent',
      sendBg: canSend ? '#1A1A1D' : '#C9C6BE',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => setTimeout(() => this.setState({ menuOpen: false }), 0),
      onFiles: (e) => { this.addFiles(e.target.files); e.target.value = ''; },
      onPaste: (e) => { const f = e.clipboardData && e.clipboardData.files; if (f && f.length) { e.preventDefault(); this.addFiles(f); } },
      onDragOver: (e) => { e.preventDefault(); if (!this.state.dragging) this.setState({ dragging: true }); },
      onDragLeave: () => this.setState({ dragging: false }),
      onDrop: (e) => { e.preventDefault(); this.setState({ dragging: false }); this.addFiles(e.dataTransfer && e.dataTransfer.files); },
      addSample: () => {
        const id = this.attId++;
        this.setState((st) => ({ atts: [...st.atts, { id, name: 'screenshot-' + id + '.png', url: '', real: false, p: 0 }], menuOpen: false }));
        this.runUpload();
      },
      onMsg: (e) => this.setState({ msg: e.target.value }),
      send: () => {
        if (!canSend) return;
        const hadImg = this.state.atts.length > 0;
        this.setState((st) => ({ sent: [...st.sent, { id: this.attId++, text: st.msg.trim(), atts: st.atts }], atts: [], msg: '', ai: hadImg ? 'thinking' : st.ai }));
        if (hadImg) { clearTimeout(this.at); this.at = setTimeout(() => this.setState({ ai: 'seen' }), 1500); }
      }
    };
  }
  sessVals() {
    const st = this.state;
    const list = st.sessions;
    const sessions = list.map((x) => {
      const on = x.id === st.activeS;
      return {
        ...x, on,
        cls: on ? 'stab on' : 'stab',
        weight: on ? '600' : '500',
        color: on ? '#1A1A1D' : '#55545A',
        closeLabel: 'Tutup sesi ' + x.title,
        select: () => this.setState({ activeS: x.id }),
        ask: () => this.setState({ confirmId: x.id })
      };
    });
    const act = list.find((x) => x.id === st.activeS);
    const target = list.find((x) => x.id === st.confirmId);
    return {
      sessions,
      activeTitle: act ? act.title : 'Sesi baru',
      showConfirm: !!target,
      confirmTitle: target ? target.title : '',
      newSession: () => {
        const id = this.nextId++;
        this.setState((s) => ({ sessions: [...s.sessions, { id, title: 'Sesi baru', dot: '#0F5F57' }], activeS: id }));
      },
      cancelDelete: () => this.setState({ confirmId: null }),
      confirmDelete: () => {
        this.setState((s) => {
          const idx = s.sessions.findIndex((x) => x.id === s.confirmId);
          let rest = s.sessions.filter((x) => x.id !== s.confirmId);
          let activeS = s.activeS;
          if (rest.length === 0) {
            const id = this.nextId++;
            rest = [{ id, title: 'Sesi baru', dot: '#0F5F57' }];
            activeS = id;
          } else if (s.activeS === s.confirmId) {
            activeS = rest[Math.min(idx, rest.length - 1)].id;
          }
          return { sessions: rest, activeS, confirmId: null };
        });
      }
    };
  }
  derive(base, strength) {
    if (strength === 'Halus') return ['#E9A77E', '#F2C38B', '#E0956A', '#EDB892'].map((acc, i) => ({ ...base, acc: i === 0 ? base.acc : acc }));
    if (strength === 'Kuat') return this.SET_B.map((v) => ({ ...v, cup: base.cup === v.bg ? v.cup : base.cup }));
    return [base.acc, '#F2C38B', '#5FB3A3', '#C98BB9'].map((acc, i) => ({ ...base, acc, steam: i === 0 ? base.steam : base.steam }));
  }
  startGen(kind) {
    const s = this.state;
    const cur = s.pal || this.SET_A;
    const n = s.imgPick || 0;
    const target = kind === 'var' ? this.derive(cur[n], s.strength) : (s.batch % 2 === 1 ? this.SET_B : this.SET_A);
    const note = kind === 'var' ? 'dari Variasi ' + (n + 1) + ' · ' + s.strength : 'prompt baru · ' + s.style;
    this.setState({ imgMode: 'generating', genKind: kind, genP: 0, target, pendingNote: note, prompt: kind === 'prompt' ? s.draft : s.prompt, appliedRatio: kind === 'prompt' ? s.ratio : s.appliedRatio });
    clearInterval(this.gt);
    this.gt = setInterval(() => {
      const np = Math.min(100, (this.state.genP || 0) + 2);
      if (np >= 100) {
        clearInterval(this.gt);
        this.setState((st) => ({ imgMode: 'view', genP: 100, pal: st.target, batch: st.batch + 1, imgPick: 0, note: st.pendingNote }));
      } else {
        this.setState({ genP: np });
      }
    }, 50);
  }
  renderVals() {
    const t = this.state.tick;
    const docStart = 6;
    const docN = Math.max(0, Math.min(this.doc.length, t - docStart));
    const replyStart = docStart + this.doc.length + 4;
    const replyN = Math.max(0, Math.min(this.reply.length, t - replyStart));
    const docDone = docN >= this.doc.length;
    const replyDone = replyN >= this.reply.length;
    const toWords = (arr, n) => arr.slice(0, n).map((w, i) => ({ t: w + (i < arr.length - 1 ? ' ' : '') }));
    const stream = {
      docWords: toWords(this.doc, docN),
      docStreaming: !docDone,
      docClass: docDone ? '' : 'writing',
      editing: !docDone,
      edited: docDone,
      progress: Math.round((docN / this.doc.length) * 100) + '%',
      showReply: t >= replyStart,
      replyWords: toWords(this.reply, replyN),
      replyStreaming: t >= replyStart && !replyDone,
      showToolbar: replyDone && t >= replyStart + this.reply.length + 8
    };
    const cur = this.state.tab;
    const defs = [{ id: 'doc', label: 'Dokumen' }, { id: 'sheet', label: 'Spreadsheet' }, { id: 'flow', label: 'Flowchart' }, { id: 'class', label: 'Class diagram' }, { id: 'erd', label: 'ERD' }, { id: 'image', label: 'Gambar' }, { id: 'code', label: 'Kode' }, { id: 'preview', label: 'Preview' }];
    const tabs = defs.map((t) => ({
      ...t,
      on: t.id === cur,
      bg: t.id === cur ? '#FFFFFF' : 'transparent',
      color: t.id === cur ? '#1A1A1D' : '#6B6A70',
      shadow: t.id === cur ? '0 1px 2px rgba(26,26,29,.08)' : 'none',
      pick: () => this.setState({ tab: t.id })
    }));
    const src = {
      flow: `flowchart TD
  A([Mulai]) --> B[Pelanggan memesan]
  B --> C{Pembayaran berhasil?}
  C -- Ya --> D[Barista siapkan kopi]
  C -- Tidak --> E[Batalkan pesanan]
  D --> F[Sajikan ke pelanggan]
  F --> G([Selesai])
  E --> G`,
      class: `classDiagram
  class Customer {
    -int Id
    -string Name
    -string Email
    +PlaceOrder() Order
  }
  class Order {
    -Guid Id
    -DateTime CreatedAt
    -OrderStatus Status
    +AddItem(item) void
    +Total() decimal
  }
  class OrderItem {
    -int Quantity
    -string? Note
    +Subtotal() decimal
  }
  class MenuItem {
    -string Name
    -decimal Price
  }
  Customer "1" --> "*" Order
  Order "1" *-- "1..*" OrderItem
  OrderItem "*" --> "1" MenuItem`,
      erd: `erDiagram
  CUSTOMER ||--o{ ORDERS : places
  ORDERS ||--|{ ORDER_ITEM : contains
  MENU_ITEM ||--o{ ORDER_ITEM : "ordered in"
  CUSTOMER {
    int id PK
    varchar name
    varchar email
  }
  ORDERS {
    uuid id PK
    int customer_id FK
    datetime created_at
    varchar status
  }
  ORDER_ITEM {
    int id PK
    uuid order_id FK
    int menu_item_id FK
    int qty
  }
  MENU_ITEM {
    int id PK
    varchar name
    decimal price
  }`
    };
    const kinds = { flow: 'flowchart', class: 'classDiagram', erd: 'erDiagram' };
    const isDiagram = !!src[cur];
    const view = this.state.view || 'render';
    const seg = (id, label) => ({ label, on: view === id, bg: view === id ? '#FFFFFF' : 'transparent', color: view === id ? '#1A1A1D' : '#6B6A70', shadow: view === id ? '0 1px 2px rgba(26,26,29,.08)' : 'none', pick: () => this.setState({ view: id }) });
    const r = isDiagram && view === 'render';
    const s = this.state;
    const mode = s.imgMode || 'view';
    const busy = mode === 'generating';
    const shown = busy ? s.target : (s.pal || this.SET_A);
    const ip = busy ? 0 : (s.imgPick || 0);
    const p = s.genP || 0;
    const thumbs = shown.map((v, i) => ({ ...v, n: 'Variasi ' + (i + 1), on: i === ip, ring: i === ip ? '2px solid #0F5F57' : '2px solid transparent', blur: '0', pick: () => this.setState({ imgPick: i }) }));
    const opt = (on) => ({ bg: on ? '#EAF3F1' : '#FFFFFF', border: on ? '1.5px solid #0F5F57' : '1px solid #E4E2DC' });
    const styleOpts = ['Flat', '3D', 'Line art', 'Cat air'].map((l) => ({ label: l, on: s.style === l, ...opt(s.style === l), pick: () => this.setState({ style: l }) }));
    const ratioOpts = ['1:1', '4:5', '16:9'].map((l) => ({ label: l, on: s.ratio === l, ...opt(s.ratio === l), pick: () => this.setState({ ratio: l }) }));
    const strengthOpts = ['Halus', 'Sedang', 'Kuat'].map((l) => ({ label: l, on: s.strength === l, ...opt(s.strength === l), pick: () => this.setState({ strength: l }) }));
    const hints = { Halus: 'Hanya warna dan detail kecil yang berubah.', Sedang: 'Komposisi tetap, palet dan gaya bervariasi.', Kuat: 'Interpretasi baru dari ide yang sama.' };
    const imgVals = {
      isImage: cur === 'image', img: shown[ip], thumbs, imgNo: 'Variasi ' + (ip + 1),
      prompt: s.prompt, draft: s.draft, styleLabel: s.style, ratioLabel: s.appliedRatio,
      busy, notBusy: !busy, promptView: mode !== 'edit', promptEdit: mode === 'edit', varyOpen: mode === 'var',
      busyLabel: s.genKind === 'var' ? 'Membuat 4 variasi…' : 'Membuat gambar baru…',
      genPct: p + '%',
      mainFilter: busy ? 'blur(' + ((1 - p / 100) * 18).toFixed(1) + 'px) saturate(' + (0.4 + p / 160).toFixed(2) + ')' : 'none',
      skels: [1, 2, 3, 4],
      batchLabel: 'Batch ' + (busy ? s.batch + 1 : s.batch),
      batchFrom: busy ? 'sedang dibuat…' : (s.note || 'hasil awal'),
      styleOpts, ratioOpts, strengthOpts, strengthHint: hints[s.strength],
      openEdit: () => this.setState({ imgMode: 'edit', draft: this.state.prompt }),
      openVary: () => { if (this.state.imgMode !== 'generating') this.setState({ imgMode: 'var' }); },
      closeAll: () => this.setState({ imgMode: 'view' }),
      onDraft: (e) => this.setState({ draft: e.target.value }),
      regen: () => this.startGen('prompt'),
      vary: () => this.startGen('var')
    };
    return { ...stream, ...imgVals, ...this.sessVals(), ...this.attVals(), tabs, isDoc: cur === 'doc', isSheet: cur === 'sheet', isFlow: r && cur === 'flow', isClass: r && cur === 'class', isErd: r && cur === 'erd', isCode: cur === 'code', isPreview: cur === 'preview', isDiagram, showSrc: isDiagram && view === 'src', srcText: src[cur] || '', mType: kinds[cur] || '', segs: [seg('render', 'Hasil'), seg('src', 'Kode Mermaid')] };
  }
}

/* =================================================================
   4. RUNTIME
   ================================================================= */
let APP, ROOT, queued = false;
function render() {
  queued = false;
  HANDLERS = [];
  const html = view(APP.renderVals());
  if (window.Idiomorph) Idiomorph.morph(ROOT, html, { morphStyle: 'innerHTML' });
  else ROOT.innerHTML = html;
}
function scheduleRender() { if (!queued) { queued = true; requestAnimationFrame(render); } }

['click', 'input', 'change', 'paste', 'dragover', 'drop', 'dragleave', 'submit'].forEach((type) => {
  document.addEventListener(type, (e) => {
    const el = e.target.closest && e.target.closest('[data-on-' + type + ']');
    if (!el || !ROOT.contains(el)) return;
    const fn = HANDLERS[+el.getAttribute('data-on-' + type)];
    if (fn) fn(e);
  }, true);
});

window.addEventListener('DOMContentLoaded', () => {
  ROOT = document.getElementById('app');
  APP = new Component({});
  window.__app = APP; // untuk debugging di console
  render();
  if (APP.componentDidMount) APP.componentDidMount();
});
window.addEventListener('pagehide', () => { if (APP && APP.componentWillUnmount) APP.componentWillUnmount(); });

</script>
</body>
