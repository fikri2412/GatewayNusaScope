  Standalone: cukup buka file ini di browser (font dimuat dari Google Fonts).

    1. <style>      → style halaman (sama persis dengan konsep)

<style>
html, body { margin: 0; min-height: 100%; }
#app > div { min-height: 100vh; }
[aria-disabled="true"] { opacity: .5; pointer-events: none; }
body{margin:0}
a{color:#0F5F57}a:hover{color:#0A443E}
.field:focus-within{border-color:#0F5F57 !important;box-shadow:0 0 0 4px #EAF3F1}
.primary:hover{background:#2C2C31}
.ghost:hover{background:#EDEBE6}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob1{animation:bob 4s ease-in-out infinite}
.bob2{animation:bob 4.6s ease-in-out .6s infinite}
.bob3{animation:bob 5.2s ease-in-out 1.2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;transform-origin:center}
@media (max-width:860px){.art{display:none !important}.form{padding:40px 20px !important}}

</style>

function view(v) {
  return `<div style="width: 100%; min-height: 820px; box-sizing: border-box; background: #F7F6F3; font-family: 'Geist', sans-serif; color: #1A1A1D; display: flex; flex-wrap: wrap">

<section class="form" style="flex: 1 1 440px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#1A1A1D"></rect><circle cx="11" cy="14" r="5" fill="none" stroke="#F7F6F3" stroke-width="2"></circle><circle cx="17" cy="14" r="5" fill="#E9A77E"></circle></svg>

<h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.8px">Selamat datang kembali</h1>
<p style="margin: 0; font-size: 15px; color: #6B6A70">Masuk untuk melanjutkan percakapanmu.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="user" style="font-size: 14px; font-weight: 500">Username</label>
<div class="field" style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #DAD7CF; border-radius: 12px; transition: box-shadow .15s">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6A70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>
<input id="user" name="username" autocomplete="username" placeholder="nama pengguna" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #1A1A1D">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="pass" style="font-size: 14px; font-weight: 500">Password</label>
<a href="#" style="font-size: 13px; font-weight: 500">Lupa password?</a>
</div>
<div class="field" style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 6px 0 14px; background: #FFFFFF; border: 1px solid #DAD7CF; border-radius: 12px; transition: box-shadow .15s">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
<input id="pass" name="password" type="${esc(v.passType)}" autocomplete="current-password" placeholder="••••••••" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #1A1A1D">
<button type="button" class="ghost" data-on-click="${on(v.toggle)}" aria-label="${esc(v.toggleLabel)}" style="width: 36px; height: 36px; border-radius: 9px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
${v.shown ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55545A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.1A10 10 0 0112 5c5 0 9 4.5 10 7a12 12 0 01-3 4.2M6.1 6.1C3.9 7.6 2.5 10 2 12c1 2.5 5 7 10 7a10 10 0 004.5-1"></path></svg>` : ''}
${v.hidden ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55545A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>` : ''}
</button>
</div>
</div>

<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3D3C42; cursor: pointer; min-height: 32px">
<input type="checkbox" style="width: 18px; height: 18px; accent-color: #0F5F57; margin: 0">Ingat saya di perangkat ini
</label>

<button type="submit" class="primary" style="height: 48px; border-radius: 12px; border: none; background: #1A1A1D; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s">
${v.loading ? `<svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#55545A" stroke-width="2.5"></circle><path d="M21 12a9 9 0 00-9-9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"></path></svg>` : ''}
${esc(v.btnLabel)}
</button>

<p style="margin: 4px 0 0 0; text-align: center; font-size: 14px; color: #6B6A70">Belum punya akun? <a href="#" style="font-weight: 600">Daftar</a></p>

</div>

<div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B6A70; flex-wrap: wrap; gap: 8px">

</div>
</section>

<div style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">MiniMax</span><span style="font-size: 12px; color: #6B6A70">Merangkum dokumen</span></div>

/* =================================================================
   3. COMPONENT — state & logika (sama dengan konsep).
   ================================================================= */

/* ------------------------------------------------------------------
   Mini runtime (± 60 baris) — meniru React class component:
   state, setState, renderVals() → view(), componentDidMount/WillUnmount.
   view(v) mengembalikan string HTML; DOM di-patch dengan Idiomorph
   supaya elemen yang tidak berubah tidak di-render ulang (animasi aman).
   Di React: renderVals() = isi function component, view() = JSX.
------------------------------------------------------------------- */
const esc = (x) => (x === null || x === undefined) ? '' : String(x)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let HANDLERS = [];
const on = (fn) => { HANDLERS.push(fn); return HANDLERS.length - 1; };

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    const p = typeof patch === 'function' ? patch(this.state) : patch;
    this.state = Object.assign({}, this.state, p);
    scheduleRender();
  }
  forceUpdate() { scheduleRender(); }
}


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { shown: false, loading: false }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const shown = this.state.shown;
    return {
      shown,
      hidden: !shown,
      passType: shown ? 'text' : 'password',
      toggleLabel: shown ? 'Sembunyikan password' : 'Tampilkan password',
      toggle: () => this.setState({ shown: !shown }),
      loading: this.state.loading,
      btnLabel: this.state.loading ? 'Memeriksa…' : 'Masuk',
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        this.setState({ loading: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => { window.location.href = '02-home.html'; }, 1200);
      }
    };
  }
}

/* =================================================================
   4. RUNTIME
   ================================================================= */
let APP, ROOT, queued = false;
function render() {
  queued = false;
  HANDLERS = [];
  const html = view(APP.renderVals());
  if (window.Idiomorph) Idiomorph.morph(ROOT, html, { morphStyle: 'innerHTML' });
  else ROOT.innerHTML = html;
}
function scheduleRender() { if (!queued) { queued = true; requestAnimationFrame(render); } }

['click', 'input', 'change', 'paste', 'dragover', 'drop', 'dragleave', 'submit'].forEach((type) => {
  document.addEventListener(type, (e) => {
    const el = e.target.closest && e.target.closest('[data-on-' + type + ']');
    if (!el || !ROOT.contains(el)) return;
    const fn = HANDLERS[+el.getAttribute('data-on-' + type)];
    if (fn) fn(e);
  }, true);
});

window.addEventListener('DOMContentLoaded', () => {
  ROOT = document.getElementById('app');
  APP = new Component({});
  window.__app = APP; // untuk debugging di console
  render();
  if (APP.componentDidMount) APP.componentDidMount();
});
window.addEventListener('pagehide', () => { if (APP && APP.componentWillUnmount) APP.componentWillUnmount(); });

</script>
